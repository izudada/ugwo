version: '3.8'

services:
  db:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    env_file:
      - ./core/.env
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  redis_data:
  sqlite_data:
